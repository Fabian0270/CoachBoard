name: Release (macOS)

# Builds the macOS .dmg installer. CoachBoard bundles better-sqlite3, a native
# module that must be compiled ON macOS for macOS, so this cannot run on the
# Windows dev machine — a GitHub macOS runner does it instead.
#
# Apple Silicon (arm64) ONLY. GitHub's free Intel (macos-13) runners are being
# retired and in practice no longer pick up jobs on public repos (they queue
# indefinitely), so the Intel leg was removed to unblock releases. arm64 covers
# every Mac sold since late 2020 (M1/M2/M3/M4).
#
# To add Intel (x64) back later — note the copied better-sqlite3 binary is
# per-arch and cannot be cross-compiled from an arm64 runner, so x64 must build
# on a native-x64 machine — one of:
#   - a `macos-13` job, if/when free Intel runners become available again;
#   - a billable `macos-13-large` runner (not free even on public repos); or
#   - a self-hosted Intel Mac runner.
#
# Trigger: push a version tag (e.g. `git tag v1.13.1 && git push --tags`), or run
# it manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the GitHub Release on a tag

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install deps. postinstall runs electron-rebuild for the host arch, which
      # is exactly the arch this runner is building for.
      - name: Install dependencies
        run: npm ci

      - name: Package macOS arm64 build
        run: npm run package:mac
        env:
          # Force an unsigned build until an Apple Developer ID cert is wired in.
          # (Also set inside package:mac; kept here so a re-run without the script
          # env is still unsigned rather than failing on a missing identity.)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: coachboard-mac-arm64
          path: dist-electron/*.dmg
          if-no-files-found: error

  release:
    # Only publish a GitHub Release when triggered by a tag push.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish DMGs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # download-artifact v4 places each artifact in its own subdirectory,
          # so the DMGs sit exactly one level down: artifacts/<name>/*.dmg
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*/*.dmg \
          || gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            artifacts/*/*.dmg
