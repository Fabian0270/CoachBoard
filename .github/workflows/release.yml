name: Release

# Builds the installers for every supported platform and publishes them as a
# GitHub Release on the public Fabian0270/CoachBoard-releases repo (where the
# installed app looks for updates from 1.18.0 on) and, while it is public, on
# this repo too. Needs .github/release-notes/<tag>.md and the RELEASES_TOKEN
# secret — see the release job. Triggered by pushing a version tag (Flow A):
#
#   # bump package.json version to match, commit, merge to main, then:
#   git tag v1.14.0
#   git push --tags
#
# The DMG/EXE filenames embed the package.json "version", so ALWAYS bump the
# version to match the tag before tagging — otherwise a v1.14.0 release ends up
# with a CoachBoard-1.13.1 file on it.
#
# Native note: until 1.17.0 better-sqlite3 was compiled per-OS/per-arch, so each
# installer had to be built on its own platform. better-sqlite3 13 ships prebuilt
# Node-API binaries for every platform, so that constraint is gone, but the
# builds still run on matching runners (unchanged and known to work). macOS is
# Apple Silicon (arm64) only; an Intel build could now come from the same runner
# by adding the x64 arch, untried so far.
#
# You can also run this manually from the Actions tab (workflow_dispatch) to get
# the installers as downloadable artifacts without publishing a release.
#
# Every path through this workflow runs `verify` first — see the note on that job.
# A tag whose commit fails typecheck or either test suite produces no installers
# and no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the GitHub Release on a tag

jobs:
  # Gate. Nothing gets packaged until typecheck and both suites pass ON THE
  # TAGGED COMMIT.
  #
  # Previously this workflow went straight from `npm ci` to `npm run package`,
  # and the CI workflow only ran on push/PR to main. scripts/release.mjs pushes
  # the branch and then the tag seconds apart, so the two workflows raced: the
  # tag build could package, publish the Release and attach latest.yml while CI
  # was still installing — and if CI then went red, the broken build was already
  # live. Windows auto-update is on, so electron-updater hands that to every
  # installed coach quietly and they restart into it.
  #
  # Kept in step with .github/workflows/ci.yml — same steps, same order.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # better-sqlite3 13 ships a prebuilt Node-API binary that loads under Node
      # and Electron alike, so nothing is compiled or rebuilt for the tests.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
      - name: Lint (React hooks)
        run: npm run lint

      - name: Server tests
        run: npm run test -w server

      - name: Client tests
        run: npm run test -w client

  build-mac:
    needs: verify
    # Apple Silicon (arm64). Pinned, not macos-latest, so the build image only
    # changes when we choose. GitHub retired macos-14 in 2026: a job asking for
    # it is cancelled before its first step ("configuration ... is not supported"),
    # which is what stopped the first v1.17.0 build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Nothing native is compiled: better-sqlite3 ships prebuilt binaries, and the
      # package script fetches the Electron binary with install-electron (Electron
      # 42+ no longer downloads itself on npm install).
      - name: Install dependencies
        run: npm ci

      - name: Package macOS arm64 build
        run: npm run package:mac
        env:
          # Force an unsigned build until an Apple Developer ID cert is wired in.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Launch what was just built, with an empty data folder, and check it
      # starts, opens its database, answers its API and serves the client. Both
      # packaging bugs so far were invisible to typecheck, tests and CI and only
      # showed up by running the app; this stops such a build here, before its
      # installer is uploaded or reaches the auto-updater. See the script.
      - name: Smoke-test the packaged app
        run: node scripts/smoke-test.mjs dist-electron/mac-arm64/CoachBoard.app/Contents/MacOS/CoachBoard

      # The .zip and latest-mac.yml are the auto-update payload and manifest;
      # electron-updater reads the manifest from the release, so a release with
      # only the .dmg attached looks complete but can never serve an update.
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: coachboard-mac-arm64
          path: |
            dist-electron/*.dmg
            dist-electron/*-mac.zip
            dist-electron/latest-mac.yml
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Uses the existing Windows package script (cmd-syntax env var runs fine
      # because npm executes scripts through cmd.exe on Windows). Produces an
      # unsigned NSIS installer until a Windows cert is configured.
      - name: Package Windows build
        run: npm run package

      # Launch what was just built, with an empty data folder, and check it
      # starts, opens its database, answers its API and serves the client. Both
      # packaging bugs so far were invisible to typecheck, tests and CI and only
      # showed up by running the app; this stops such a build here, before its
      # installer is uploaded or reaches the auto-updater. See the script.
      - name: Smoke-test the packaged app
        run: node scripts/smoke-test.mjs dist-electron/win-unpacked/CoachBoard.exe

      # latest.yml is what the installed app polls to discover a new version.
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: coachboard-windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          if-no-files-found: error

  release:
    # Only publish a GitHub Release when triggered by a tag push, and only once
    # BOTH installers have built successfully so the release is never half-done.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    # Where coaches get updates from (1.18.0 on): the public CoachBoard-releases
    # repo, so this code repo can be private. Writing there needs RELEASES_TOKEN,
    # a fine-grained token limited to that one repo, Contents read/write, stored
    # as an Actions secret. Whoever holds it can publish an update every Windows
    # install will take, so:
    #  - only THIS job sees it, and this job installs and runs no npm code — the
    #    build jobs (npm ci, packaging) never get it;
    #  - only a version tag starts it, and tags are pushed by Fabian alone.
    # No deployment environment with required reviewers: on GitHub Free those
    # work only in public repos, and environments are not available at all in a
    # private repo on Free — this repo is going private.
    steps:
      # Only the release notes are read from the repo (no code, nothing run).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish installers to the release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CODE_TOKEN: ${{ github.token }}
          RELEASES_REPO: Fabian0270/CoachBoard-releases
        run: |
          # download-artifact v4 places each artifact in its own subdirectory,
          # so the files sit exactly one level down: artifacts/<name>/<file>.
          # Artifact names are hyphenated (no spaces) so the names in latest.yml,
          # on disk, and on the GitHub release all agree — see the nsis
          # artifactName note in electron-builder.yml.
          #
          # The .yml manifests must be attached alongside the installers or
          # auto-update silently finds nothing on a release that looks complete.
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(artifacts/*/*.dmg artifacts/*/*.exe artifacts/*/*-mac.zip artifacts/*/latest*.yml)

          # Fail loudly rather than publishing a release missing its update
          # manifest — a silent half-release is worse than no release.
          # NB: check the expanded array, not `ls`. With nullglob a missing file
          # leaves `ls` with no arguments, so it lists the working directory and
          # exits 0 — the guard would pass exactly when it should fail.
          MANIFESTS=(artifacts/*/latest.yml)
          if [ ${#MANIFESTS[@]} -eq 0 ]; then
            echo "::error::latest.yml is missing — auto-update would not work for this release."
            exit 1
          fi

          # Coaches read these on the public releases page, so they are written
          # for coaches and kept in the repo; notes generated from this repo's
          # pull requests would point at a private repo. No notes, no release.
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing — write the coach-facing release notes first."
            exit 1
          fi
          if [ -z "${RELEASES_TOKEN}" ]; then
            echo "::error::The RELEASES_TOKEN secret is not set (or has expired) — nothing was published."
            exit 1
          fi

          # Create the release, or attach to it if the tag already has one. Only
          # the "already exists" case should fall through to upload, so check for
          # it explicitly instead of masking every failure behind ||.
          # publish <repo> <token> [extra create flags]. The token is handed to
          # each gh call itself, never left in the job's environment.
          publish() {
            local repo="$1" token="$2"; shift 2
            if GH_TOKEN="$token" gh release view "${GITHUB_REF_NAME}" --repo "$repo" >/dev/null 2>&1; then
              GH_TOKEN="$token" gh release upload "${GITHUB_REF_NAME}" --repo "$repo" --clobber "${ASSETS[@]}"
            else
              GH_TOKEN="$token" gh release create "${GITHUB_REF_NAME}" --repo "$repo" --title "CoachBoard ${GITHUB_REF_NAME}" \
                --notes-file "$NOTES" "$@" "${ASSETS[@]}"
            fi
          }

          # The releases repo FIRST: if its token is missing or expired this fails
          # before anything is published anywhere — never half a release. Its tag
          # is made on its own main branch (it holds no code).
          publish "${RELEASES_REPO}" "${RELEASES_TOKEN}" --target main

          # Then this repo, while it is public: installs older than 1.18.0 still
          # look here for updates, and this is how they reach a version that
          # looks in the releases repo. Drop this once the repo is private.
          publish "${GITHUB_REPOSITORY}" "${CODE_TOKEN}"
