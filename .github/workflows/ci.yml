name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # better-sqlite3 13 ships a prebuilt Node-API binary that loads under Node
      # and Electron alike, so nothing is compiled or rebuilt for the tests.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Server tests
        run: npm run test -w server

      - name: Client tests
        run: npm run test -w client
