appId: com.coachboard.app
productName: CoachBoard
electronVersion: "33.4.11"
electronDist: ../node_modules/electron/dist
electronLanguages:
  - en-US

directories:
  output: ../dist-electron

# The single source for every platform's icon. electron-builder resolves
# buildResources to ./build, would pick build/icon.png up implicitly, and
# generates the .ico (Windows exe + NSIS installer) and .icns (mac .app + dmg)
# from it at package time — so no .ico or .icns is committed. Named explicitly
# anyway: the implicit lookup is silent when it fails, and a build that quietly
# ships the default Electron atom is exactly the kind of thing that only gets
# noticed after a release. Source must stay square and >= 256x256.
icon: build/icon.png

# Tells electron-builder where published builds live, which is what makes it emit
# the latest.yml / latest-mac.yml update manifests that electron-updater reads,
# and what the installed app reads from resources/app-update.yml to know where to
# check. Without this block no update metadata is generated at all.
#
# IMPORTANT: the package scripts pass `--publish never`. On a tag build in CI,
# electron-builder otherwise treats this block as "upload the artifacts yourself"
# and fails the whole build with "GitHub Personal Access Token is not set". The
# release workflow attaches the assets with `gh release` instead.
publish:
  provider: github
  owner: Fabian0270
  repo: CoachBoard

files:
  - dist/**/*
  # NOTE: electron-updater's own deps `semver` and `builder-util-runtime` are
  # ALSO dependencies of electron-builder (a devDependency). With npm workspaces
  # they hoist to the root node_modules, where electron-builder saw them as dev
  # and pruned them from the asar — so require('electron-updater') threw
  # MODULE_NOT_FOUND and the packaged app died silently before it could log
  # anything. They are declared as direct dependencies of this workspace to keep
  # them in the production tree. Verify with `npx asar list` after packaging.

extraResources:
  - from: ../server/dist/electron-bundle.cjs
    to: server/dist/electron-bundle.cjs
  - from: ../client/dist
    to: client/dist
    # MediaPipe ships two WASM builds of the same runtime, ~12 MB each, and only
    # one of them is ever loaded: the classic (`importScripts`) build, because
    # Vite emits workers as IIFE in a production build. The `_module_` pair is
    # needed only in dev, where Vite serves workers as ES modules — so it is
    # excluded here rather than paid for in every installer and, because
    # electron-updater downloads the whole installer, in every update.
    #
    # pose.worker.ts picks its loader at runtime from whether `importScripts`
    # exists. IF THAT EVER BECOMES A MODULE WORKER — anyone setting
    # `worker.format: 'es'` in client/vite.config.ts — this exclusion starts
    # deleting the only loader that would work, and pose will fail in the
    # packaged build ONLY, which CI cannot see. Delete this filter if that day
    # comes.
    #
    # The models are the same story: both are vendored so the 11e-0 spike can
    # keep comparing them on real footage, but only the one the app loads is
    # worth shipping. That is `lite` — the spike measured `full` at ~46 ms a
    # frame against a ~33 ms budget, and `lite` at ~32 ms with identical
    # detection. If 11e-6's joint angles come out noisy and `full` is
    # reinstated, flip which line is negated here AND the model the worker asks
    # for: those two must agree, and nothing checks that they do.
    filter:
      - '**/*'
      - '!vendor/mediapipe/wasm/vision_wasm_module_internal.*'
      - '!vendor/mediapipe/models/pose_landmarker_full.task'
  - from: ../node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: ../node_modules/bindings
    to: node_modules/bindings
  - from: ../node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path

win:
  target:
    - target: nsis
      arch: [x64]
  # Code signing is optional until a certificate is available. electron-builder
  # signs automatically when CSC_LINK (path to / base64 of the .pfx) and
  # CSC_KEY_PASSWORD are present in the environment; with no certificate set it
  # produces an UNSIGNED build (current behaviour). The block below only
  # configures *how* signing happens once a cert is supplied — it does not force
  # signing. See docs/CODE_SIGNING.md for how to obtain and configure a cert.
  signtoolOptions:
    # RFC-3161 timestamp so signatures stay valid after the cert expires.
    rfc3161TimeStampServer: http://timestamp.digicert.com
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  # Hyphens, not spaces. electron-builder writes the hyphenated name into
  # latest.yml regardless, and GitHub rewrites spaces in uploaded asset names —
  # so a spaced filename means the updater asks for a URL that does not exist and
  # every update check 404s silently. Keeping all three in agreement is the fix.
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  category: public.app-category.healthcare-fitness
  # No arch is pinned here on purpose: electron-builder defaults to the arch of
  # the build machine. better-sqlite3 is a native module copied from node_modules
  # (see extraResources + npmRebuild:false), so it is only ever correct for the
  # host arch — cross-compiling would ship a broken binary. The release workflow
  # therefore builds each arch on a matching runner (macos-13 = Intel x64,
  # macos-14 = Apple Silicon arm64) instead of pinning [arm64, x64] here.
  target:
    - target: dmg
    # Squirrel.Mac updates from a zip, not a dmg, and without a zip target
    # latest-mac.yml is never generated. Built now so the metadata is already
    # correct the day a Developer ID cert lands — macOS auto-update stays off
    # until then, because Squirrel.Mac refuses to update an unsigned bundle.
    - target: zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing is OPTIONAL until an Apple Developer ID cert is available, mirroring
  # the Windows setup above. electron-builder signs automatically when a signing
  # identity is present (CSC_LINK + CSC_KEY_PASSWORD, or a keychain identity);
  # the build sets CSC_IDENTITY_AUTO_DISCOVERY=false to force an UNSIGNED build
  # when no cert is configured, so CI and local Mac builds are never blocked.
  # Notarization is off until signing is in place. See docs/CODE_SIGNING.md.

dmg:
  # Include the arch in the filename so the two per-arch runners never collide
  # when their artifacts are attached to the same GitHub Release.
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: false
