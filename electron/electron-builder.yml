appId: com.coachboard.app
productName: CoachBoard
electronVersion: "33.4.11"
electronDist: ../node_modules/electron/dist
electronLanguages:
  - en-US

directories:
  output: ../dist-electron

files:
  - dist/**/*

extraResources:
  - from: ../server/dist/electron-bundle.cjs
    to: server/dist/electron-bundle.cjs
  - from: ../client/dist
    to: client/dist
  - from: ../node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: ../node_modules/bindings
    to: node_modules/bindings
  - from: ../node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
